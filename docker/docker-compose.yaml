services:
  php:
    build:
      context: .
      dockerfile: php/Dockerfile
    container_name: crypto_tracker_php
    working_dir: /var/www/html
    volumes:
      - ../symfony:/var/www/html
      - ./php/conf.d:/usr/local/etc/php/conf.d
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGODB_URI=mongodb://${MONGODB_USER}:${MONGODB_PASSWORD}@mongodb:27017
      - MONGODB_DB=${MONGODB_DB}
      - APP_ENV=${APP_ENV}
    networks:
      - crypto_network

  nginx:
    image: nginx:latest
    container_name: crypto_tracker_nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ../symfony:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - crypto_network

  mongodb:
    image: mongo:7.0
    container_name: crypto_tracker_mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGODB_DB}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    networks:
      - crypto_network
    healthcheck:
      test: mongosh --eval "db.adminCommand('ping')" --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongodb_data:
    driver: local

networks:
  crypto_network:
    driver: bridge
